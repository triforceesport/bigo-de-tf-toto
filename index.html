/* ---------- Écran verrouillé ---------- */

/* ---------- Apps : chrome iOS commun ---------- */
.as{background:#fff;color:#000;animation:open .26s cubic-bezier(.2,.8,.2,1)}.screen.noanim{animation:none!important}

/* ---------- WhatsApp ---------- */
.wa .nav{background:#f6f6f6;border-bottom:.5px solid var(--sep)}

  background-image:radial-gradient(rgba(0,0,0,.035) 1.2px,transparent 1.3px);background-size:18px 18px}

.call b.miss{color:var(--red)}
.call small{font-size:14px;color:var(--label2)}
.call .w{font-size:15px;color:var(--label2)}
.vm{border-bottom:.5px solid var(--sep);padding:12px 16px 14px 0}

.empty{color:var(--label2);text-align:center;padding:80px 30px;font-size:17px;line-height:1.4}

.phview{background:#000;color:#fff}.phview.noanim{animation:none}
.phview .nav{background:rgba(0,0,0,.6)}
.phview .nav h2 small{color:#aaa}
.phimg{flex:1;display:grid;place-items:center;min-height:0;padding:0 0 8px}
.phimg img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.phcap{padding:12px 16px 40px;background:#111;font-size:15px;line-height:1.4}
.phcap small{color:#999;display:block;margin-bottom:4px}

/* ---------- Notes ---------- */
.notes .nav .back,.notes .nav .act{color:#e5a600}
.nlist{margin:0 16px;background:#fff;border-radius:11px;overflow:hidden}
.nlist button{display:block;width:100%;text-align:left;padding:11px 16px;border-bottom:.5px solid var(--sep)}
.nlist button:last-child{border-bottom:0}
.nlist b{font-size:17px;font-weight:600;display:block}
.nlist small{font-size:15px;color:var(--label2)}
.ndoc{padding:4px 20px 40px;font-size:17px;line-height:1.45}
.ndoc h3{font-size:28px;margin:0 0 4px}
.ndoc .when{color:var(--label2);font-size:13px;text-align:center;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.chk i{width:22px;height:22px;border-radius:50%;border:1.5px solid #c7c7cc;flex:none;box-sizing:border-box;display:grid;place-items:center;margin-top:1px}
.chk.on i{background:#e5a600;border-color:#e5a600}
.chk.on i::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.on span{color:var(--label2)}
.chk small{display:block;color:var(--label2);font-size:14px}

/* ---------- Fichiers ---------- */
.fic .nav .back{color:var(--blue)}
.frow{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 0;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.frow .fi{width:44px;height:52px;flex:none;display:grid;place-items:center}
.frow b{font-size:16px;font-weight:500;word-break:break-word;display:block}
.frow small{font-size:13px;color:var(--label2)}
.pwbox{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 24px}
.pwbox input{width:100%;max-width:280px;padding:11px 14px;border-radius:10px;border:0;background:#eeeef0;color:#000;font:17px var(--sf);text-align:center}
.pwbox .err{color:var(--red);font-size:14px;min-height:18px}
.ibtn{padding:12px 22px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:17px}
.doc{font:14px/1.6 var(--mono);white-space:pre-wrap;padding:14px 18px 30px;color:#111}
.doc em{color:#b5650d;font-style:normal;font-weight:600}

/* ---------- Discord ---------- */
.dc{background:#313338;color:#f2f3f5}
.dc .nav{background:#2b2d31}
.dc .nav .back{color:#f2f3f5}
.dc .nav h2 small{color:#b5bac1}
.sec{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#949ba4;font-weight:700;margin:16px 16px 6px}
.chan{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:6px;width:calc(100% - 16px);margin:0 8px;text-align:left;font-size:16px;color:#949ba4;box-sizing:border-box}
.chan .h{font-size:20px;width:20px;text-align:center}
.chan.new{color:#f2f3f5;font-weight:600}
.chan.new::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:#f2f3f5}
.chan .av{width:32px;height:32px;font-size:13px}
.dmsg{display:flex;gap:12px;padding:8px 14px}
.dmsg .av{width:40px;height:40px;font-size:15px}
.dmsg b{font-size:16px;font-weight:600}
.dmsg b small{font-weight:400;color:#949ba4;font-size:12px;margin-left:6px}
.dmsg p{margin:2px 0 0;font-size:16px;line-height:1.38;color:#dbdee1}

.dwrap{flex:1;display:flex;min-height:0}
.rail{width:72px;flex:none;background:#1e1f22;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto}
.srv{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;transition:border-radius .15s}
.srv.on{border-radius:16px}
.srv.on::before{content:"";position:absolute;left:-12px;top:8px;width:4px;height:32px;border-radius:0 4px 4px 0;background:#fff}
.srv .pip{position:absolute;left:-12px;top:20px;width:4px;height:8px;border-radius:0 4px 4px 0;background:#fff}
.srv.on .pip{display:none}
.rsep{width:32px;height:2px;border-radius:1px;background:#35363c}
.dpanel{flex:1;background:#2b2d31;border-top-left-radius:14px;padding-bottom:30px;min-width:0}
.dhead{font-size:17px;font-weight:700;padding:14px 16px 10px;border-bottom:1px solid #1f2023;color:#f2f3f5}
.dhead small{display:block;font-size:12px;font-weight:400;color:#949ba4;margin-top:2px}
.dday{display:flex;align-items:center;gap:8px;margin:12px 14px 4px;color:#949ba4;font-size:12px;font-weight:600}
.dday::before,.dday::after{content:"";flex:1;height:1px;background:#3f4147}
.dclip{display:flex;gap:10px;align-items:center;margin-top:6px;background:#2b2d31;border:1px solid #1f2023;border-radius:8px;padding:10px;max-width:260px}
.dclip .pl{width:36px;height:36px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-size:14px;flex:none}
.dclip b{display:block;font-size:14px;color:#00a8fc;word-break:break-all}
.dclip small{font-size:12px;color:#949ba4}
.dmsg.dgrp{padding-top:0;margin-top:-6px}
.dimg{display:block;max-width:100%;max-height:300px;border-radius:8px;margin-top:6px}
.react{display:flex;gap:6px;margin-top:6px}
.react span{background:#2b2d31;border:1px solid #3f4147;border-radius:8px;padding:3px 8px;font-size:14px;color:#dbdee1}
.react b{font-weight:600;margin-left:3px}
.ment{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px;font-weight:500}
.dreply{display:flex;align-items:center;gap:5px;margin:8px 14px -4px 34px;font-size:13px;color:#b5bac1;white-space:nowrap;overflow:hidden;position:relative;padding-left:20px}
.dreply .rl{position:absolute;left:0;top:9px;width:16px;height:12px;border-left:2px solid #4e5058;border-top:2px solid #4e5058;border-top-left-radius:6px}
.dreply b{font-weight:600;flex:none}
.dreply>span:last-child{overflow:hidden;text-overflow:ellipsis}
.dmsg.dhl{background:rgba(240,178,50,.1);box-shadow:inset 3px 0 0 #f0b232}
.jumbo{width:48px;height:48px;display:block;margin-top:2px}
.edited{font-size:11px;color:#949ba4}
.xemb{border-left-color:#1d9bf0}
.xemb .xau{color:#f2f3f5;font-size:14px}
.xemb .xd{color:#dbdee1;font-size:14px;line-height:1.35}
.xemb .xf{display:flex;align-items:center;gap:6px}
.xemb .xf span{width:18px;height:18px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:10px}
.btag{background:#5865f2;color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.dlink{color:#00a8fc;text-decoration:none;word-break:break-all}
.dlink:hover{text-decoration:underline}
.embed{display:grid;gap:6px;margin:6px 0 10px;background:#2b2d31;border-left:4px solid #9146ff;border-radius:6px;padding:10px 12px 12px;text-decoration:none;max-width:300px}
.embed small{color:#b5bac1;font-size:12px}
.embed b{color:#00a8fc;font-size:15px;line-height:1.3}
.eimg{display:grid;place-items:center;aspect-ratio:16/9;border-radius:6px;background:#000 center/cover}
.eimg i{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-style:normal;display:grid;place-items:center;font-size:18px}
.dinput{margin:6px 12px 30px;background:#383a40;border-radius:20px;padding:11px 16px;color:#80848e;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
/* ---------- Letterboxd ---------- */
.lb{background:#14181c;color:#fff}
.lb .nav{background:#14181c}
.lb .nav .back{color:#40bcf4}
.lb .nav h2 small{color:#9ab}
.lbprof{display:flex;gap:14px;align-items:center;padding:6px 16px 16px;border-bottom:1px solid #2c3440}
.lbprof .stats{display:flex;gap:18px;font-size:12px;color:#9ab;margin-top:6px}
.lbprof .stats b{display:block;font-size:17px;color:#fff}
.lbentry{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #2c3440}
.poster{width:60px;aspect-ratio:2/3;border-radius:4px;flex:none;display:grid;place-items:end start;padding:5px;box-sizing:border-box;font-size:9px;font-weight:800;line-height:1.1;color:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.lbentry h4{margin:0;font-size:16px}
.lbentry h4 small{color:#9ab;font-weight:400;margin-left:4px;font-size:13px}
.stars{color:#00e054;font-size:13px;letter-spacing:1px;margin:3px 0}
.lbentry p{margin:4px 0 0;font-size:15px;line-height:1.45;color:#cdd6e0}

/* ---------- Clash of Clans ---------- */
.coc{background:#5aa33c}
.village{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 40%,#7cc24f 0,transparent 30%),radial-gradient(circle at 70% 70%,#6bb544 0,transparent 35%),#5aa33c}
.village .bld{position:absolute;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.cochud{position:absolute;top:54px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.cochud span{background:rgba(0,0,0,.55);border-radius:8px;padding:5px 10px;font-weight:800;font-size:13px}
.cocpop{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45);z-index:4}
.cocbox{background:#f3e7c9;color:#3a2a10;border:4px solid #6b4a1c;border-radius:16px;padding:18px;max-width:300px;width:100%;display:grid;gap:10px;text-align:center;animation:open .3s;box-sizing:border-box}
.cocbox h3{margin:0;font-size:24px;font-weight:900;color:#b02a1a}
.cocbox .mem{display:flex;gap:10px;align-items:center;text-align:left;background:#e8d7ae;border-radius:10px;padding:8px}
.cocbox .mem .av{width:42px;height:42px}
.cocbox .mem small{display:block;color:#7a5a2a}
.cocbtn{background:#5cb82e;color:#fff;font-weight:900;border-radius:10px;padding:11px;border-bottom:4px solid #3b7d1b}
.cocx{position:absolute;top:56px;left:14px;z-index:5;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:5px 10px;font-weight:800;font-size:13px}

/* ---------- Tinder ---------- */
.ti{background:#fff}
.tihead{padding:52px 16px 6px;display:flex;align-items:center;justify-content:space-between;flex:none}
.tihead .logo{font-size:26px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#fd267a,#ff7854);-webkit-background-clip:text;background-clip:text;color:transparent}
.tihead .back{color:#7c8591;font-size:16px;display:flex;align-items:center;gap:3px}
.likebanner{margin:4px 12px 0;padding:10px 14px;border-radius:12px;background:#fff6dc;color:#9a6a00;font-size:14px;font-weight:600;text-align:left;flex:none}
.deck{position:relative;flex:1;margin:10px 10px 0;min-height:0}
.card{position:absolute;inset:0;border-radius:12px;overflow:hidden;touch-action:none;transition:transform .3s;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:grab;color:#fff}
.card .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:rgba(255,255,255,.88)}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:90px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.card h3{margin:0;font-size:30px;display:flex;align-items:baseline;gap:8px;font-weight:800}
.card h3 small{font-size:24px;font-weight:400}
.card .tag{display:inline-block;margin-top:6px;font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22)}
.card p{margin:8px 0 0;font-size:15px;line-height:1.4}
.stamp{position:absolute;top:34px;padding:2px 12px;border:4px solid;border-radius:8px;font-size:34px;font-weight:900;opacity:0;transform:rotate(-18deg)}
.stamp.like{left:20px;color:#3be8b0}
.stamp.nope{right:20px;color:#fd5068;transform:rotate(18deg)}
.tibtns{display:flex;justify-content:center;gap:34px;padding:14px 0 34px;flex:none}
.tibtns button{width:66px;height:66px;border-radius:50%;background:#fff;font-size:30px;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.15);display:grid;place-items:center}
.tibtns .n{color:#fd5068} .tibtns .y{color:#3be8b0}
.match{position:absolute;inset:0;z-index:20;background:linear-gradient(180deg,rgba(253,38,122,.85),rgba(20,10,20,.95));display:grid;place-items:center;text-align:center;padding:30px;animation:open .3s;color:#fff}
.match h3{font-size:46px;margin:0;font-style:italic;font-weight:900;letter-spacing:-1px}
.wbtn{padding:12px 22px;border-radius:999px;border:2px solid #fff;color:#fff;font-weight:700}

/* ---------- Winamax ---------- */
.wx{background:#0e0e0e;color:#fff}
.wx .nav{background:#000}
.wx .nav .back{color:#fff}
.wx .nav h2 small{color:#aaa}
.wxalert{background:#2a1a00;border:1px solid #e0a526;color:#ffcf5c;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;margin:12px}
.wxev{background:#1a1a1a;border-radius:12px;padding:12px;margin:0 12px 12px}
.wxev .ttl{font-size:12px;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wxev b{display:block;font-size:16px;margin:2px 0 10px}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.odd{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;background:#262626;font-size:14px;gap:6px}
.odd span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.odd.sel{background:#e3001b}
.slip{background:#fff;color:#111;border-radius:14px;padding:14px;display:grid;gap:10px;margin:0 12px}
.slip .h{display:flex;justify-content:space-between;font-weight:800}
.slip .h span{background:#e3001b;color:#fff;border-radius:999px;padding:1px 9px;font-size:13px}
.slip .line{display:flex;justify-content:space-between;gap:8px;font-size:15px;border-bottom:1px solid #eee;padding-bottom:8px}
.slip label{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:10px}
.slip input{width:90px;padding:8px;border-radius:8px;border:1px solid #ccc;font:600 16px var(--sf);text-align:right;background:#fff;color:#111}
.slip .gain{display:flex;justify-content:space-between;font-weight:700}
.slip .ibtn{background:#e3001b;width:100%}
.slip .err{color:#e3001b;font-size:14px;font-weight:600;min-height:18px;text-align:center}

/* ---------- Proman ---------- */
.pm{background:#f4f5f8}
.pm .nav{background:#e30613;color:#fff}
.pm .nav .back{color:#fff}
.pm .nav h2 small{color:rgba(255,255,255,.85)}
.pmuser{display:flex;gap:10px;align-items:center;font-size:15px;color:#5b5e70;margin:14px 14px 12px}
.pmuser .av{width:38px;height:38px;font-size:15px}
.pmcard{background:#fff;border-radius:14px;padding:14px;display:grid;gap:6px;box-shadow:0 2px 8px rgba(20,20,40,.08);margin:0 12px 12px}
.pmcard.hot{outline:2px solid #e30613}
.pmcard .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#e30613}
.pmcard b{font-size:17px}
.pmcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:4px 0 0;font-size:14px}
.pmcard dt{color:#7a7d8e}
.pmcard dd{margin:0;font-weight:600}
.pm .ibtn{background:#e30613;width:100%}

/* ---------- Divers apps iOS ---------- */
.cal-day{display:flex;justify-content:space-around;padding:4px 10px 10px;border-bottom:.5px solid var(--sep)}
.cal-day span{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--label2);font-weight:600}
.cal-day b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:500;color:#000}
.cal-day .on b{background:var(--red);color:#fff;font-weight:700}
.hour{display:grid;grid-template-columns:52px 1fr;min-height:46px;font-size:12px;color:var(--label2);position:relative}
.hour::after{content:"";position:absolute;left:52px;right:0;top:7px;border-top:.5px solid #e2e2e4}
.ev{margin:12px 8px 4px 0;border-radius:5px;padding:6px 9px;font-size:14px;font-weight:600;position:relative;z-index:1;color:#000}
.ev small{display:block;font-weight:400;font-size:13px}
.alarm{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px 0;border-bottom:.5px solid var(--sep)}
.alarm b{font-size:52px;font-weight:300;letter-spacing:-1px;display:block;line-height:1.1}
.alarm small{font-size:15px}
.alarm.off b,.alarm.off small{color:var(--label2)}
.sw{width:51px;height:31px;border-radius:16px;background:#e9e9eb;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.dark-as{background:#000;color:#fff}
.dark-as .nav h2{color:#fff}
.cam{flex:1;display:flex;flex-direction:column;background:#000}
.cam .vf{flex:1;margin:96px 0 0;background:linear-gradient(160deg,#2b2b30,#0b0b0d);display:grid;place-items:center;color:#777;font-size:15px;position:relative;text-align:center;padding:20px}
.cam .ctl{height:170px;display:flex;align-items:center;justify-content:space-around;padding-bottom:20px}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:58px;height:58px;border-radius:50%;background:#fff}
.camthumb{width:46px;height:46px;border-radius:8px;background:#333 center/cover}
.flash{position:absolute;inset:0;background:#fff;animation:fl .35s forwards;z-index:9;pointer-events:none}
@keyframes fl{to{opacity:0}}
.safbar{margin:auto 12px 30px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.12);display:flex;gap:8px;align-items:center;color:var(--label2);font-size:17px}
.sftiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:0 16px}
.sftiles button{display:grid;justify-items:center;gap:6px;font-size:12px;color:#333}
.sftiles .tile{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
.imsg{background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.imsg .bub{background:#e9e9eb;border-radius:18px;box-shadow:none;padding:8px 12px}
.store-row{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 0;border-bottom:.5px solid var(--sep)}
.store-row .ic{width:56px;height:56px;border-radius:13px}
.store-row .ic svg{width:32px;height:32px}
.store-row .m{flex:1;min-width:0}
.store-row b{font-size:16px;display:block}
.store-row small{font-size:13px;color:var(--label2)}
.getbtn{background:#eeeef0;color:var(--blue);font-weight:700;font-size:14px;border-radius:999px;padding:6px 16px}
.getbtn.ok{color:var(--label2)}

/* ---------- Gestes ---------- */
.lock{touch-action:none}
.notifs .inotif{transition:transform .25s, opacity .25s;touch-action:none}
.notifs .inotif.gone{transform:translateX(-110%);opacity:0}
.unlock-anim{transition:transform .3s ease-in,opacity .3s}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;scrollbar-width:none;flex:1;min-height:0}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;padding:0 22px;box-sizing:border-box}
.pdots{display:flex;gap:8px;justify-content:center;margin:6px 0 10px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);align-self:center}
.pdots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.pdots button.on{background:#fff}

/* ---------- Calendrier mois ---------- */
.mhead{display:flex;justify-content:space-between;align-items:center;padding:0 16px 8px}
.mhead b{font-size:22px;text-transform:capitalize}
.mhead button{color:var(--red);font-size:22px;padding:4px 10px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;row-gap:2px;border-bottom:.5px solid var(--sep);padding-bottom:8px}
.mgrid .wd{font-size:11px;color:var(--label2);text-align:center;font-weight:600;padding:4px 0}

    </div>
    <div class="lockfoot">
      <span class="qbtn"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 2h8l-1 6h-6zM9.5 9h5v11.5a1.5 1.5 0 0 1-1.5 1.5h-2a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span>
      <button class="swipe">Balayez vers le haut pour ouvrir</button>
      <span class="qbtn"><svg viewBox="0 0 24 24">${G.camera.replace(/#2c2c2e/,"#fff")}</svg></span>
    </div></div>`;
  const scr=$(".screen");
  // Gestes : glisser vers le haut = déverrouiller ; glisser une notification vers la gauche = la retirer ; toucher = ouvrir
  let st=null;
  scr.addEventListener("pointerdown",e=>{ if(e.target.closest(".muswidget")) return; st={x:e.clientX,y:e.clientY,t:e.target.closest(".inotif"),sw:e.target.closest(".swipe"),moved:false}; try{scr.setPointerCapture(e.pointerId);}catch(_){} });
  scr.addEventListener("pointermove",e=>{ if(!st) return; const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(Math.abs(dx)>6||Math.abs(dy)>6) st.moved=true;
    if(st.t && Math.abs(dx)>Math.abs(dy)){ st.t.style.transition="none"; st.t.style.transform=`translateX(${Math.min(0,dx)}px)`; st.t.style.opacity=1+Math.min(0,dx)/300; }
    else if(dy<0){ scr.style.transform=`translateY(${dy*.6}px)`; scr.style.opacity=1+dy/500; } });
  const end=e=>{ if(!st) return; const dx=e.clientX-st.x, dy=e.clientY-st.y, t=st.t, sw=st.sw, moved=st.moved; st=null;
    scr.style.transition="transform .25s, opacity .25s";
    if(t){ t.style.transition=""; }
    if(t && dx<-90 && Math.abs(dx)>Math.abs(dy)){ t.classList.add("gone"); const k=t.dataset.n; S.read["lockn_"+k]=1; save(); setTimeout(()=>t.remove(),260); scr.style.transform=""; scr.style.opacity=""; return; }
    if(t){ t.style.transform=""; t.style.opacity=""; }
    if(dy<-70){ scr.style.transform="translateY(-100%)"; scr.style.opacity="0"; setTimeout(()=>{S.unlocked=true;save();go("home");},220); return; }
    scr.style.transform=""; scr.style.opacity="";
    if(!moved && (t || sw)) {S.unlocked=true;save();go("home");} };
  scr.addEventListener("pointerup",end); scr.addEventListener("pointercancel",e=>{ st=null; scr.style.transform=""; scr.style.opacity=""; });
};

    <div class="passfoot"><button id="sos">Urgence</button><button id="del">${code.length?"Supprimer":"Annuler"}</button></div>
  </div>`;
  $$("[data-k]").forEach(b=>b.onclick=()=>{

}
R.tinder=()=>{
  if(!S.tv2){ S.tIdx=0; S.tv2=1; save(); }
  if(tTab==="likes") return rTinderLikes();
  if(tTab==="conv") return rTinderConv();
  const cards=[S.tIdx+1,S.tIdx].filter(i=>i<TOPS.length).map(i=>TOPS[i]), cur=TOPS[S.tIdx];
  root.innerHTML=`<div class="screen tn"><div class="tntop" style="background:${cur?`color-mix(in srgb,${col(cur.n)} 40%,#3a2a2a)`:"#1a1a1d"}">
      <button class="tnback" id="back" aria-label="Retour">${chevron}</button><button class="tnf" aria-label="Filtres">${TNI.filt}</button>
      <div class="tntabs"><span class="on">Pour toi</span><span>Double Date</span><span>Astro</span><span>Musique</span></div>
      <button class="tnb" aria-label="Boost">${TNI.bolt}</button></div>
    <div class="deck tndeck">${cur?"":`<div class="tnempty"><span>${TNI.flame}</span><p>Plus aucun profil à voir, dead role</p></div>`}${cards.map((t,i)=>`<div class="card" ${i===cards.length-1?'id="top"':""}>
        <div class="pic" data-pics='${JSON.stringify(t.pics)}' style="${tnBg(t.pics[0])}"></div>
        <div class="tndots">${t.pics.map((p,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</div>
        <span class="stamp like">LIKE</span><span class="stamp nope">NOPE</span>
        <div class="info"><span class="tnchip">À proximité</span>
          <h3>${t.n}${t.a?` <small>${t.a}</small>`:""}</h3>
          ${t.rows.map(r=>`<div class="tnrow"><span class="tnq">❝</span>${r}</div>`).join("")}
          <button class="tnup" data-bio aria-label="Voir le profil">${TNI.up}</button></div></div>`).join("")}
      <div class="tnbtns"><button class="s" id="rew" aria-label="Revenir">${TNI.rew}</button><button class="l" id="no" aria-label="Passer">${TNI.x}</button><button class="s" id="sup" aria-label="Super Like">${TNI.star}</button><button class="l" id="yes" aria-label="Liker">${TNI.heart}</button><button class="s" id="snd" aria-label="Envoyer">${TNI.send}</button></div>
    </div>
    ${tnNav()}
    ${tMatch?`<div class="match"><div style="display:grid;gap:16px;justify-items:center"><h3>It's a Match!</h3>${dcAv("Clawser",96)}<p style="margin:0;font-size:16px">Clawser sera à la Lyon Esport.</p>${recBtn("clawser")}<button class="wbtn" id="closem">Continuer à swiper</button></div></div>`:""}
  </div>`;
  tnBindNav(); bindBack();
  $$("[data-bio]").forEach(b=>{ b.onpointerdown=e=>e.stopPropagation(); b.onclick=e=>{e.stopPropagation(); toast(cur.bio);}; });
  $("#rew").onclick=()=>toast("Réservé à Tinder Gold");
  $("#sup").onclick=()=>toast("Aucun Super Like disponible");
  $("#snd").onclick=()=>toast("Message direct réservé aux abonnés Platinum.");
  if(tMatch) $("#closem").onclick=()=>{tMatch=false;render();};
  if(!cur){ ["#no","#yes"].forEach(q=>$(q).onclick=()=>toast("Plus aucun profil à voir, dead role")); return; }
  const top=$("#top");
  let tpi=0;
  const flip=dir=>{ const pic=top.querySelector(".pic"), P=JSON.parse(pic.dataset.pics); if(P.length<2) return; tpi=(tpi+dir+P.length)%P.length; pic.setAttribute("style",tnBg(P[tpi])); top.querySelectorAll(".tndots i").forEach((d,k)=>d.classList.toggle("on",k===tpi)); };
  const decide=like=>{
    top.style.transform=`translateX(${like?500:-500}px) rotate(${like?30:-30}deg)`;
    setTimeout(()=>{
      if(cur.me && !like && !has("clawser")){ S.clawLike=1; S.tIdx++; save(); render(); banner("tinder","Tinder","Clawser vous a envoyé un like 💛"); return; }
      S.tIdx++; save();
      if(like && cur.me){ tMatch=true; S.clawMatch=1; save(); render(); return; }
      render();
    },250);
  };
  $("#yes").onclick=()=>decide(true); $("#no").onclick=()=>decide(false);
  let x0=null,dx=0;
  let tapX=null;
  top.onpointerdown=e=>{x0=e.clientX;tapX=e.clientY<top.getBoundingClientRect().bottom-230?e.clientX:null;dx=0;top.style.transition="none";top.setPointerCapture(e.pointerId);};
  top.onpointermove=e=>{ if(x0===null)return; dx=e.clientX-x0; top.style.transform=`translateX(${dx}px) rotate(${dx/15}deg)`;
    top.querySelector(".like").style.opacity=Math.max(0,dx/100); top.querySelector(".nope").style.opacity=Math.max(0,-dx/100); };
  top.onpointerup=top.onpointercancel=()=>{ if(x0===null)return; x0=null; top.style.transition="";
    if(Math.abs(dx)>90) decide(dx>0); else {top.style.transform="";top.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);
      if(Math.abs(dx)<6&&tapX!==null){ const r=top.getBoundingClientRect(); flip(tapX-r.left>r.width/2?1:-1); } } };
};

    const dl=$("#dl"); if(dl) dl.onclick=()=>{ L.splice(alarmEdit,1); alarmEdit=null; save(); render(); };
  }
};

R.photos=()=>{
  if(sub){
    const swiped=phSwipe;
    const p=PHOTOS.find(p=>p.id===sub), [d,h]=p.when.split(" · ");
    root.innerHTML=`<div class="screen as phview${phSwipe?" noanim":""}">${nav(d,{small:h||"",back:"Photothèque"})}
      <div class="phimg"><img src="${p.src}" alt="Photo du ${d}"></div>
      ${p.cap||p.rec?`<div class="phcap"><small>${p.when}</small>${p.cap}${p.rec?`<div>${recBtn(p.rec)}</div>`:""}</div>`:`<div style="height:40px"></div>`}</div>`;
    subBack();
    const idx=PHOTOS.indexOf(p), box=$(".phimg"), img=box.querySelector("img");
    const goTo=d=>{ const n=PHOTOS[idx+d]; if(!n){ img.style.transition="transform .2s"; img.style.transform=""; return; }
      img.style.transition="transform .18s ease-out,opacity .18s"; img.style.transform=`translateX(${-d*100}%)`; img.style.opacity=".3";
      setTimeout(()=>{ sub=n.id; phSwipe=true; render(); phSwipe=false; const ni=$(".phimg img"); if(ni){ ni.style.transform=`translateX(${d*60}%)`; ni.style.opacity=".3"; requestAnimationFrame(()=>{ ni.style.transition="transform .18s ease-out,opacity .18s"; ni.style.transform=""; ni.style.opacity=""; }); } },170); };
    let x0=null,dx=0;
    box.style.touchAction="pan-y";
    box.onpointerdown=e=>{ x0=e.clientX; dx=0; img.style.transition="none"; box.setPointerCapture&&box.setPointerCapture(e.pointerId); };
    box.onpointermove=e=>{ if(x0===null) return; dx=e.clientX-x0; const edge=(dx>0&&idx===0)||(dx<0&&idx===PHOTOS.length-1); img.style.transform=`translateX(${edge?dx/4:dx}px)`; };
    box.onpointerup=box.onpointercancel=()=>{ if(x0===null) return; x0=null; if(Math.abs(dx)>60) goTo(dx<0?1:-1); else { img.style.transition="transform .2s"; img.style.transform=""; } };
    document.onkeydown=e=>{ if(view!=="photos"||!sub) return; if(e.key==="ArrowRight") goTo(1); if(e.key==="ArrowLeft") goTo(-1); };
    return;
  }
  root.innerHTML=`<div class="screen as ph">${nav("",{act:"Sélectionner"})}<h1 class="big-t">Photothèque</h1>
    <div class="scroll" id="pscroll"><div class="pgrid">${PHOTOS.map(p=>`<button data-p="${p.id}" style="background-image:url('${p.src}')" aria-label="Photo du ${p.when}"></button>`).join("")}</div>
    <p style="text-align:center;color:var(--label2);font-size:13px;margin:14px 0"><b style="color:#000">${PHOTOS.length} photos</b><br>Synchronisé il y a 2 min</p></div>
    <div class="tabbar"><button class="on">${tabIco("lib")}Photothèque</button><button>${tabIco("star")}Pour vous</button><button>${tabIco("folder")}Albums</button><button>${tabIco("search")}Rechercher</button></div></div>`;
  bindBack();
  const sc=$("#pscroll"); sc.scrollTop=sc.scrollHeight;
  $$("[data-p]").forEach(b=>b.onclick=()=>{sub=b.dataset.p;render();});
};
